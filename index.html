<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Showcase — a Vue 3 + Tailwind component library</title>
    <meta name="description" content="A personal, from-scratch Vue 3 + TypeScript + Tailwind component library with 43 accessible components, documented in Storybook." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
